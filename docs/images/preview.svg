<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Hospital Workspace Dashboard UI -->
  <g transform="translate(80, 50)" filter="url(#shadow)">
    <!-- Main Window Frame -->
    <rect width="1040" height="530" rx="16" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Header Bar -->
    <rect width="1040" height="50" rx="16" fill="#020617"/>
    <circle cx="28" cy="25" r="6" fill="#ef4444"/>
    <circle cx="48" cy="25" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="25" r="6" fill="#10b981"/>
    <text x="520" y="30" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">MedFlow Hospital Management System • Clinical Operations Dashboard</text>

    <!-- Sidebar navigation -->
    <rect x="20" y="70" width="220" height="440" rx="10" fill="#020617" stroke="rgba(255,255,255,0.06)"/>
    <text x="35" y="105" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="800">🏥 MedFlow AI</text>
    
    <!-- Nav Items -->
    <rect x="30" y="130" width="200" height="34" rx="6" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1"/>
    <text x="45" y="152" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">📊 OPD Queue &amp; Token</text>
    
    <text x="45" y="195" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">🛏️ IPD &amp; Bed Census</text>
    <text x="45" y="235" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">🩺 Doctor Consultations</text>
    <text x="45" y="275" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">💳 Itemized Billing</text>
    <text x="45" y="315" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">🛡️ Mediclaim Tracking</text>
    <text x="45" y="355" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">📋 Discharge Summaries</text>

    <!-- Main Content Area: Metric cards -->
    <g transform="translate(260, 70)">
      <!-- Metric 1 -->
      <rect width="240" height="90" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Active OPD Queue</text>
      <text x="20" y="68" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">42 Patients</text>
      <text x="160" y="66" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">● Live Token</text>

      <!-- Metric 2 -->
      <rect x="260" y="0" width="240" height="90" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
      <text x="280" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">IPD Bed Occupancy</text>
      <text x="280" y="68" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">86%</text>
      <text x="410" y="66" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">52/60 Beds</text>

      <!-- Metric 3 -->
      <rect x="520" y="0" width="240" height="90" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
      <text x="540" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Daily OPD Revenue</text>
      <text x="540" y="68" fill="#10b981" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">₹1,48,500</text>
    </g>

    <!-- Table / Queue View -->
    <g transform="translate(260, 180)">
      <rect width="760" height="330" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
      <text x="25" y="35" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Real-Time Clinical Appointments</text>

      <!-- Row Headers -->
      <rect x="25" y="55" width="710" height="32" rx="4" fill="#0f172a"/>
      <text x="40" y="76" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">TOKEN</text>
      <text x="120" y="76" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PATIENT ID</text>
      <text x="240" y="76" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">DOCTOR</text>
      <text x="400" y="76" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">DEPARTMENT</text>
      <text x="580" y="76" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">STATUS</text>

      <!-- Row 1 -->
      <text x="40" y="115" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">#014</text>
      <text x="120" y="115" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12">HMS-2026-089</text>
      <text x="240" y="115" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12">Dr. Rajesh Patel</text>
      <text x="400" y="115" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Cardiology</text>
      <rect x="580" y="100" width="95" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="627" y="115" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">In Consultation</text>

      <!-- Row 2 -->
      <text x="40" y="155" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">#015</text>
      <text x="120" y="155" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12">HMS-2026-092</text>
      <text x="240" y="155" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12">Dr. Ananya Sharma</text>
      <text x="400" y="155" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">General Medicine</text>
      <rect x="580" y="140" width="75" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="617" y="155" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Waiting</text>
    </g>
  </g>
</svg>